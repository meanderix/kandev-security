- name: cancel_report
  description: Cancel a task-owned draft and discard its unpublished findings. Requires
    current expected_revision. Cancellation is safe to repeat; completed reports cannot
    be cancelled with this tool.
  surfaces:
  - kanban-task
  - office-task
  input_schema:
    type: object
    properties:
      draft_id:
        type: string
        maxLength: 128
        minLength: 1
      expected_revision:
        type: integer
        minimum: 0
    required:
    - draft_id
    - expected_revision
    additionalProperties: false
  output_schema:
    type: object
    properties:
      workspace_id:
        type: string
      source:
        type: string
      retrieved_at:
        type: string
      data:
        type: object
      truncated:
        type: boolean
      notices:
        type: array
        items:
          type: string
      error:
        type: object
        properties:
          code:
            type: string
          message:
            type: string
        required:
        - code
        - message
        additionalProperties: false
    required:
    - workspace_id
    - source
    - retrieved_at
    - truncated
    - notices
    additionalProperties: false
  annotations:
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: true
    open_world_hint: false
